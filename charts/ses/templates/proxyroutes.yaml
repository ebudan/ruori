---
# Having problems using tlsoptions from default namespace. 
# Using a local version always worked prior to v2.10.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  labels:
    instance: instance-{{ $.Values.deployment.name }}
  name: tlsoptions
  namespace: {{ .Values.deployment.namespace }}
spec:
  preferServerCipherSuites: true
  sniStrict: false
  minVersion: VersionTLS12
{{- /* user and core modules handled identically, so merge with some sprig magic */ -}}
{{- range $name, $conf := merge (dict) (default (dict) .Values.modules.core) (default (dict) .Values.modules.user) }}
{{- range $conf.entryPoints }}
{{- /* - if .map */ -}}
{{- if and .name .hostPort }}
---
apiVersion: traefik.io/v1alpha1
{{- if .passthrough }}
kind: IngressRouteTCP
{{- else }}
kind: IngressRoute
{{- end }}
metadata:
  # annotations:
  #   traefik.ingress.kubernetes.io/router.entrypoints: {{$name}}
  labels: 
    instance: instance-{{ $.Values.deployment.name }}
  name: proxy-{{$name}}
  namespace: {{ $.Values.deployment.namespace }}
spec:
  entryPoints:
    - {{ .name }}
  tls:
  {{- if .passthrough }}
    passthrough: true
  {{- else }}
    # as defined in traefik chart elsewhere...
    certResolver: letsencrypt
    options:
      name: tlsoptions
      namespace: {{ $.Values.deployment.namespace }}
  {{- end }}
  routes:
      {{- if .passthrough }}
    - match: HostSNI(`{{ $.Values.deployment.host }}`)
      {{- else }}
    - kind: Rule
      match: Host(`{{ $.Values.deployment.host }}`)
      {{- end }}
      services:
        - name: {{ $name }}
          namespace: {{ $.Values.deployment.namespace }}
          port: {{ required "missing containerPort" .containerPort }} # We use containerPort for service as well as containers for some degree of simplicity..
{{- end }}
{{- end }}
{{- end }}