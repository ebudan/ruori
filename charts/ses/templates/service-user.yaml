{{- range $module, $config := .Values.modules.user }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $module }}
  namespace: {{ $.Values.deployment.namespace }}
  labels:
    instance: instance-{{ $.Values.deployment.name }}
    name: {{ $module }}
    module: {{ $module }}
spec:
  # user services have default 9191 open to other modules only
  ports:
  {{- range $config.entryPoints }}
    - protocol: TCP
      port: {{ or .containerPort 9191 }}
      targetPort: {{ or .containerPort 9191 }}
  {{- end }}
  selector:
    module: {{ $module }}
    instance: instance-{{ $.Values.deployment.name }}
{{- end }}